[project]
name = "jobspulse"
version = "0.1.0"
description = "JobsPulse is an AI-powered platform that provides employment and unemployment statistics from government PLFS reports."
readme = "README.md"
authors = [
    { email = "tharunkumar" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]


[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
